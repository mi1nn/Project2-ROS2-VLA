name: vla-kit-system

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data_network

  mongodb:
    image: mongo:7.0.40-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?MONGO_DATABASE is required}
      TZ: UTC
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./infra/mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 })\" >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - data_network

  vision:
    build:
      context: .
      dockerfile: src/kit_vision/Dockerfile
    command: ["ros2", "run", "kit_vision", "object_detection"]
    restart: unless-stopped   # 운영 핵심 노드 — 호스트 리부팅/크래시에도 자동 복구
    network_mode: host   # 호스트에서 도는 realsense2_camera 토픽을 그대로 구독
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-20}   # 호스트 realsense2_camera와 같은 도메인이어야 토픽이 보인다

  vision-debug:
    profiles: ["debug"]   # `docker compose up -d`(전체 기동) 기본값에서 제외 — xhost 없이 뜨면 크래시
    build:
      context: .
      dockerfile: src/kit_vision/Dockerfile
    command: ["ros2", "run", "kit_vision", "debug_view"]
    depends_on: [vision]
    restart: "no"   # X11/xhost에 의존하는 디버그 툴 — 자동 재시작하면 크래시루프
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}       # debug_view 팝업창용. 호스트에서 `xhost +local:docker` 먼저 실행
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-20}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

volumes:
  postgres_data:
  mongodb_data:

networks:
  data_network:
    driver: bridge