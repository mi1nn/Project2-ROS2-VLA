# The name of this file shouldn't be changed, or else the Setup Assistant won't detect it
#
# MoveIt occupancy map monitor (Octomap) — eye-in-hand RealSense D435.
# MoveItConfigsBuilder.to_moveit_configs() 가 config/sensors_3d.yaml 을 자동으로 읽어
# move_group 파라미터에 합치므로 start.launch.py 는 건드리지 않는다.
#
# 단위는 MoveIt 네이티브인 m 이다(프로젝트 mm 규약은 Python pose API 에만 적용).
sensors:
  - realsense_d435

realsense_d435:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater

  # kit_robot motion.py 가 중계하는 게이트 토픽(motion.yaml: moveit.octomap.cloud_out).
  # 로봇 없이 항상 매핑하고 싶으면 /camera/depth/color/points 로 바꾼다.
  point_cloud_topic: /kit/octomap_cloud

  # D435 는 1.5 m 를 넘으면 노이즈가 급증한다. 작업영역(테이블 + 트레이)만 담는다.
  max_range: 1.2

  point_subsample: 2

  # 로봇 자신·그리퍼를 걸러낼 때 링크 형상을 얼마나 부풀릴지. m 단위 offset.
  # "안전거리"에 해당하는 옥토맵 옵션은 이거 하나뿐이다. offset 0 + scale
  # 1.0(SRDF 링크 형상 그대로)까지 같이 낮췄을 때는 팔뚝/손목처럼 ACM 에서
  # 일부러 뺀(진짜 회피 대상인) 부위가 self-filter 여유 부족으로 자기
  # 자신을 voxel 로 잡아 로봇이 멈춰버린 적이 있다 — 그래서 scale(곱연산,
  # 여유의 대부분을 차지)은 1.3 을 유지하고 offset(덧연산)만 0.002 로
  # 줄인다. 그래도 같은 증상(자기 몸을 장애물로 오인 → 정지)이 재현되면
  # 바로 0.02 로 되돌릴 것 — 이 값 자체가 실측으로 맞는 값이라는 보장은
  # 없고, 한 단계씩 낮춰보며 확인하는 중이다.
  padding_offset: 0.002
  padding_scale: 1.3

  max_update_rate: 5.0

  # 셀프필터 통과분. RViz PointCloud2 로 붙여서 캘리브레이션 검증에 쓴다.
  filtered_cloud_topic: /kit/octomap_filtered_cloud

# 고정 프레임이어야 한다. keepout box 와 같은 frame 을 쓴다(motion.yaml: moveit.base_frame).
octomap_frame: base_link

# 10 mm voxel (6mm 에서 실측 확인차 상향). 2mm까지 낮췄다가 D435 자체의
# 깊이 노이즈 floor(작업 거리 30~70cm 에서 수 mm 단위로 흔들림)보다 voxel
# 이 더 잘게 썰리면서 평면이 울퉁불퉁하게 잡히는 문제가 심해져 되돌린
# 이력이 있다 — 노이즈 자체는 motion.py 의 옥토맵 클라우드 디노이즈
# (`_remove_outlier_points`)와 아래 RealSense 필터로 잡는 게 맞고, 여기는
# 그 위에 얹는 여유분 정도다.
# 주의: 물체 폭이 50~110mm(grasp_params.json), 그리퍼 파지 폭도 그 근방
# 이라 voxel 이 10mm면 물체 하나가 voxel 5~10개 정도로 아직은 형태가
# 남지만, 더 키우면(예: 50mm) voxel 한 칸이 물체보다 커져 파지 자체가
# 막힐 수 있다 — 이 위로는 올리지 말 것.
octomap_resolution: 0.02
