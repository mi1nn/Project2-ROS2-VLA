motion:
  # MoveIt2 interface settings.
  moveit:
    planning_group: "manipulator"
    base_frame: "base_link"
    eef_link: "link_6"

    joint_names:
      - "joint_1"
      - "joint_2"
      - "joint_3"
      - "joint_4"
      - "joint_5"
      - "joint_6"

    move_group_action: "/dsr01/move_action"
    execute_trajectory_action: "/dsr01/execute_trajectory"
    cartesian_path_service: "/dsr01/compute_cartesian_path"
    apply_planning_scene_service: "/dsr01/apply_planning_scene"

    default_keepout_box:
      enabled: true
      id: "base_keepout_box"

      min_cm: [-200.0, 40.0, -100.0]
      max_cm: [200.0, 100.0, 600.0]

      marker_topic: "/kit_robot/default_keepout_box_marker"

    server_ready_timeout_sec: 15.0
    motion_timeout_sec: 60.0
    tf_timeout_sec: 2.0

    planning_time_sec: 5.0
    planning_attempts: 5
    pipeline_id: ""
    planner_id: ""

    joint_tolerance_deg: 0.5

    default_joint_velocity_scale: 0.15
    default_joint_acceleration_scale: 0.15

    cartesian_max_step_m: 0.005
    cartesian_min_fraction: 0.999
    cartesian_jump_threshold: 0.0
    cartesian_prismatic_jump_threshold: 0.0
    cartesian_revolute_jump_threshold: 0.0

    cartesian_acc_reference_mm_s2: 1000.0

  positions:
    home:
      type: "joint"
      pos: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]

      joint_vel: 30.0
      joint_acc: 60.0

      joint_velocity_scale: 0.15
      joint_acceleration_scale: 0.15

    observation_pose:
      type: "joint"
      pos: [0.0, 0.0, 60.0, 0.0, 120.0, 0.0]

      joint_vel: 30.0
      joint_acc: 60.0

      joint_velocity_scale: 0.15
      joint_acceleration_scale: 0.15

    inspection_pose:
      type: "cartesian"

      # [x_mm, y_mm, z_mm, A_deg, B_deg, C_deg]
      # intrinsic ZYZ Euler
      pos: [-382.990, 45.070, 398.620, 13.30, -177.59, -78.66]

      joint_velocity_scale: 0.15
      joint_acceleration_scale: 0.15

      position_tolerance_mm: 2.0
      orientation_tolerance_deg: 2.0

  place:
    linear_vel: 60.0
    linear_acc: 120.0

    slots:
      slot_1:
        pos: [-397.42, 138.87, 230.0, 41.74, 179.48, -136.13]

      slot_2:
        pos: [-397.42, 3.44, 230.0, 39.02, 179.37, -138.95]

      slot_3:
        pos: [-397.42, -132.0, 230.0, 36.29, 179.26, -141.78]

      slot_4:
        pos: [-513.55, 138.87, 230.0, 39.02, 179.37, -138.95]

      slot_5:
        pos: [-513.55, 3.44, 230.0, 36.29, 179.26, -141.78]

      slot_6:
        pos: [-513.55, -132.0, 230.0, 33.57, 179.15, -144.6]
