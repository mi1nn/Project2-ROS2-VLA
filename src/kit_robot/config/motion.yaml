motion:
  # MoveIt2 interface settings.
  # Standard Doosan M0609 SRDF uses group=manipulator, base_link -> tool0.
  # If m0609_rg2_moveit_config defines an RG2 TCP as the planning tip, change
  # eef_link to that exact frame. This frame must also match the frame used by
  # T_gripper2camera.npy hand-eye calibration.
  moveit:
    planning_group: "manipulator"
    base_frame: "base_link"
    eef_link: "link_6"

    joint_names:
      - "joint_1"
      - "joint_2"
      - "joint_3"
      - "joint_4"
      - "joint_5"
      - "joint_6"

    # Standard move_group capability names. If your launch namespaces move_group,
    # change these to e.g. /dsr01/move_action, etc.
    move_group_action: "/dsr01/move_action"
    execute_trajectory_action: "/dsr01/execute_trajectory"
    cartesian_path_service: "/dsr01/compute_cartesian_path"

    server_ready_timeout_sec: 15.0
    motion_timeout_sec: 60.0
    tf_timeout_sec: 2.0

    planning_time_sec: 5.0
    planning_attempts: 5
    pipeline_id: ""
    planner_id: ""

    joint_tolerance_deg: 0.5

    # DSR movej used absolute deg/s and deg/s^2. MoveIt planning uses scaling
    # factors against joint_limits.yaml, so these values are the MoveIt equivalent
    # knobs. 0.15 is intentionally conservative for the initial real-robot test.
    default_joint_velocity_scale: 0.15
    default_joint_acceleration_scale: 0.15

    # DSR movel replacement: /compute_cartesian_path -> /execute_trajectory.
    cartesian_max_step_m: 0.005
    cartesian_min_fraction: 0.999
    cartesian_jump_threshold: 0.0
    cartesian_prismatic_jump_threshold: 0.0
    cartesian_revolute_jump_threshold: 0.0

    # GetCartesianPath accepts absolute max Cartesian speed, so vel=80 means
    # 80 mm/s -> 0.08 m/s. It accepts acceleration only as a joint scaling factor;
    # this reference maps acc=160 mm/s^2 to 0.16 for the initial tuning.
    cartesian_acc_reference_mm_s2: 1000.0

  positions:
    home:
      type: "joint"
      pos: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]
      # Existing DSR values are retained as documentation.
      joint_vel: 30.0
      joint_acc: 60.0
      joint_velocity_scale: 0.15
      joint_acceleration_scale: 0.15

    observation_pose:
      type: "joint"
      pos: [0.0, 0.0, 60.0, 0.0, 120.0, 0.0]
      joint_vel: 30.0
      joint_acc: 60.0
      joint_velocity_scale: 0.15
      joint_acceleration_scale: 0.15

    inspection_pose:
      type: "joint"
      pos: [173.0, 7.0, 54.0, 0.0, 117.0, 80.0]
      joint_vel: 30.0
      joint_acc: 60.0
      joint_velocity_scale: 0.15
      joint_acceleration_scale: 0.15

  place:
    linear_vel: 60.0
    linear_acc: 120.0

    slots:
      slot_1:
        pos: [-397.42, 138.87, 230.0, 41.74, 179.48, -136.13]

      slot_2:
        pos: [-397.42, 3.44, 230.0, 39.02, 179.37, -138.95]

      slot_3:
        pos: [-397.42, -132.0, 230.0, 36.29, 179.26, -141.78]

      slot_4:
        pos: [-513.55, 138.87, 230.0, 39.02, 179.37, -138.95]

      slot_5:
        pos: [-513.55, 3.44, 230.0, 36.29, 179.26, -141.78]

      slot_6:
        pos: [-513.55, -132.0, 230.0, 33.57, 179.15, -144.6]
